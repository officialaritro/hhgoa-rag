[project]
name = "hhgoa-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
    "numpy",
    "datasets",
    "sentence-transformers",
    "faiss-cpu",
    "huggingface_hub",
    "anthropic",
    "elevenlabs",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
markers = [
    "unit: fast, fully-mocked tests",
    "integration: tests that touch real external resources",
]
