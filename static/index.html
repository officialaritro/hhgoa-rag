<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Voice-Enabled RAG Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-radial: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #0a0a0f 70%);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --red: #ef4444;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      color-scheme: dark;
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      background-image: var(--bg-radial);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Strategy Pill Selector */
    .header {
      width: 100%;
      padding: 2rem 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      z-index: 10;
    }

    .strategy-group {
      display: flex;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.2s ease;
    }

    .strategy-group label {
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .strategy-group input { display: none; }
    .strategy-group input:checked + label {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    /* Compare toggle */
    .compare-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .compare-toggle input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
    .compare-toggle:has(input:checked) { color: #fff; }

    /* Compare grid */
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 640px) {
      .compare-grid { grid-template-columns: 1fr; }
    }
    .compare-column h3 { margin-bottom: 0.75rem; }
    .compare-column .answer { font-size: 1rem; color: #fff; margin: 0 0 1rem 0; line-height: 1.5; }
    .compare-column .answer.refusal { color: var(--red) !important; font-weight: 500; }

    /* Central Mic UI */
    .mic-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      min-height: 300px;
    }
    
    .mic-status-text {
      position: absolute;
      top: 10%;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .mic-hint {
      position: absolute;
      bottom: 12%;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .mic-hint kbd {
      font-family: inherit;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text);
    }
    body.state-idle .mic-hint { opacity: 1; }

    .visualizer-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .mic-button {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    
    .mic-button svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
      transition: transform 0.3s;
    }
    
    .mic-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Result Layout -- a wide dashboard grid once a query completes, not a
       single narrow vertical stack. #outputContainer breaks into an
       answer + sidebar row plus a full-width citations row at >=900px;
       #compareContainer stays a single column here since its own
       .compare-grid child already provides the two-up layout. */
    .output-container {
      width: 100%;
      max-width: 1180px;
      padding: 0 1.5rem 3rem;
      z-index: 10;
      display: none;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      transform: translateY(20px);
      opacity: 0;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (min-width: 900px) {
      #outputContainer {
        grid-template-columns: 2fr 1fr;
        grid-template-areas:
          "answer sidebar"
          "citations citations";
      }
      .result-answer-card { grid-area: answer; }
      .result-latency-card { grid-area: sidebar; }
      .result-citations-card { grid-area: citations; }
    }

    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .card h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin: 0 0 0.5rem 0;
      font-weight: 600;
    }

    .result-transcript {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0 0 1.25rem 0;
      font-style: italic;
      opacity: 0.9;
    }

    #answer {
      font-size: 1.3rem;
      color: #fff;
      margin: 0;
      line-height: 1.65;
    }

    #answer strong { color: var(--accent); font-weight: 600; }
    .refusal { color: var(--red) !important; font-weight: 500; }

    /* Latency bar chart -- label+value on one line, track full-width below,
       so it reads cleanly whether it's sitting in a wide card or a narrow
       sidebar/compare column. */
    .latency-bar-row { padding: 0.5rem 0; font-variant-numeric: tabular-nums; font-size: 0.78rem; }
    .latency-bar-topline { display: flex; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.3rem; }
    .latency-bar-label { color: var(--text-muted); }
    .latency-bar-value { color: var(--text); }
    .latency-bar-track { height: 6px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-border); overflow: hidden; }
    .latency-bar-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.4s ease; }
    .latency-bar-row.total {
      margin-top: 0.4rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--glass-border);
      font-weight: 600;
    }
    .latency-bar-row.total .latency-bar-label,
    .latency-bar-row.total .latency-bar-value { color: #fff; }

    /* Citations -- a responsive tile grid rather than a single-file list,
       so the citations card actually uses the width it's given. */
    #citations, .compare-column .citations {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
    }
    .citation-row {
      padding: 0.85rem 1rem;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
    }
    .citation-header { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.4rem; }
    .citation-index { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em; }
    .citation-relevance-track { flex: 1; }
    .citation-text { margin: 0; font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }
    .citations-empty { margin: 0; font-size: 0.85rem; color: var(--text-muted); font-style: italic; }

    /* STATE MACHINE STYLES */
    
    /* State: idle */
    body.state-idle .mic-status-text { opacity: 1; }
    body.state-idle .mic-button {
      animation: pulse-soft 3s infinite;
    }

    /* State: recording */
    body.state-recording .mic-status-text { opacity: 1; color: var(--red); }
    body.state-recording .mic-button {
      transform: scale(1.1);
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: var(--red);
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.2);
    }
    body.state-recording .visualizer-canvas { opacity: 1; }

    /* State: processing */
    body.state-processing .mic-button {
      animation: spin-pulse 1.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.4);
      color: var(--accent);
    }
    body.state-processing .mic-status-text { opacity: 1; }
    body.state-processing .output-container { opacity: 0.5; }
    body.state-processing .result-answer-card,
    body.state-processing .result-latency-card,
    body.state-processing .result-citations-card,
    body.state-processing .compare-column { opacity: 0; }

    /* State: done -- each card/column reveals with its own delay, so the
       whole dashboard cascades in as one orchestrated sequence instead of
       everything popping in at once. */
    body.state-done .output-container {
      opacity: 1;
      transform: translateY(0);
    }
    body.state-done .result-answer-card,
    body.state-done .result-latency-card,
    body.state-done .result-citations-card,
    body.state-done .compare-column {
      animation: reveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    body.state-done .result-latency-card { animation-delay: 0.08s; }
    body.state-done .result-citations-card { animation-delay: 0.16s; }
    body.state-done #compareCol_semantic { animation-delay: 0.1s; }

    /* State: error */
    body.state-error .mic-button { border-color: var(--red); color: var(--red); }
    body.state-error .output-container { opacity: 1; transform: translateY(0); }

    /* Animations */
    @keyframes pulse-soft {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.05); }
      70% { box-shadow: 0 0 0 20px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }
    @keyframes spin-pulse {
      0% { transform: scale(1); box-shadow: 0 0 20px var(--accent-glow); }
      50% { transform: scale(0.95); box-shadow: 0 0 40px var(--accent-glow); }
      100% { transform: scale(1); box-shadow: 0 0 20px var(--accent-glow); }
    }
    @keyframes reveal {
      from { opacity: 0; filter: blur(4px); transform: translateY(10px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
  </style>
</head>
<body class="state-idle">
  
  <div class="header">
    <div class="strategy-group" id="strategyChoices">
      <span style="font-size: 0.8rem; padding: 6px 16px; color: var(--text-muted);">Loading...</span>
    </div>
    <label class="compare-toggle">
      <input type="checkbox" id="compareToggle">
      <span>Compare strategies</span>
    </label>
  </div>

  <div class="mic-container">
    <div id="statusText" class="mic-status-text">Hold to speak</div>
    <canvas id="visualizer" class="visualizer-canvas" width="300" height="300"></canvas>
    
    <button id="recordBtn" class="mic-button" aria-label="Hold to record">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>

    <div class="mic-hint">or hold <kbd>Space</kbd></div>
  </div>

  <div class="output-container" id="outputContainer">
    <div class="card result-answer-card">
      <p id="transcript" class="result-transcript"></p>
      <h3>Answer</h3>
      <p id="answer"></p>
    </div>

    <div class="card result-latency-card">
      <h3>Latency</h3>
      <div id="latency"></div>
    </div>

    <div class="card result-citations-card">
      <h3>Citations</h3>
      <div id="citations"></div>
    </div>
  </div>

  <div class="output-container" id="compareContainer">
    <div class="card">
      <p id="compareTranscript" class="result-transcript"></p>
      <p id="compareRefusal" class="refusal" style="display: none;"></p>
    </div>

    <div class="compare-grid">
      <div class="card compare-column" id="compareCol_fixed_size">
        <h3>fixed-size</h3>
        <p class="answer"></p>
        <div class="latency"></div>
        <div class="citations"></div>
      </div>
      <div class="card compare-column" id="compareCol_semantic">
        <h3>semantic</h3>
        <p class="answer"></p>
        <div class="latency"></div>
        <div class="citations"></div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
